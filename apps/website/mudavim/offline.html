<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>Bağlantı gerekli · Tahmisçi Müdavim</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;background:#fbf6ee;color:#2c1609;font-family:Arial,sans-serif;padding:24px}.card{width:min(460px,100%);border:1px solid rgba(90,47,29,.2);border-radius:24px;background:#fffaf3;box-shadow:0 20px 55px rgba(44,22,9,.12);padding:30px;text-align:center}.card img{width:112px;height:112px;border-radius:24px}.card h1{margin:20px 0 10px;font-size:1.8rem}.card p{margin:0;color:#5a2f1d;line-height:1.6}.card button{min-height:46px;margin-top:22px;border:0;border-radius:13px;background:#5a2f1d;color:#fffaf3;padding:10px 20px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img src="/assets/app-icons/mudavim/icon-192.png" alt="Tahmisçi Müdavim">
    <h1>Bağlantı gerekli.</h1>
    <p>Hesap, profil ve bildirim işlemlerine devam etmek için internet bağlantınızı kontrol edin.</p>
    <button type="button" onclick="location.reload()">Yeniden Dene</button>
  </main>
</body>
</html>
